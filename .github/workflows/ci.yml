name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Schemas are up to date
        shell: bash
        run: |
          cargo run -q -p infermark-cli -- schema export --dir schema
          git diff --exit-code schema/

  # llama.cpp linked into the process (feature `llama-inproc`), the engine phones will use.
  # Builds llama.cpp from source and generates a few tokens with a tiny model.
  llama-inproc:
    name: In-process llama.cpp (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      # TinyStories 15M (llama.cpp's own test model), pinned to a revision and hash-checked.
      TEST_GGUF_URL: https://huggingface.co/ggml-org/models/resolve/499bc8821c6b12b4e53c5bffcb21ec206f212d81/tinyllamas/stories15M-q8_0.gguf
      TEST_GGUF_SHA256: 2eda49203f2f044f3dddf29a7dd7cc861ef5a0340f518a19613d73ba6d9c06b6
      INFERMARK_TEST_GGUF: ${{ github.workspace }}/.test-models/stories15M-q8_0.gguf
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies (CMake is preinstalled; bindgen needs libclang)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          cmake --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: llama-inproc
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.test-models
          key: test-gguf-${{ env.TEST_GGUF_SHA256 }}
      - name: Download test model
        run: |
          if [ ! -f "$INFERMARK_TEST_GGUF" ]; then
            mkdir -p "$(dirname "$INFERMARK_TEST_GGUF")"
            curl -fsSL --retry 3 -o "$INFERMARK_TEST_GGUF" "$TEST_GGUF_URL"
          fi
          echo "$TEST_GGUF_SHA256  $INFERMARK_TEST_GGUF" | sha256sum -c -
      - name: Clippy
        run: cargo clippy --all-targets --features infermark-engine/llama-inproc -- -D warnings
      - name: Test
        run: cargo test -p infermark-engine --features llama-inproc -- --nocapture

  desktop:
    name: Desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate
      - name: Typecheck and build UI
        run: npm run build
      - name: Build desktop app (no bundle)
        run: npx tauri build --no-bundle
      - name: App tests
        working-directory: apps/desktop/src-tauri
        run: cargo test

  # The Android app: llama.cpp compiled for arm64 with the NDK and linked in. Debug-signed and
  # sideload-only; the APK is kept for a week so it can be tried on a phone.
  android:
    name: Android APK (aarch64)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.3.13750724
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: NDK and libclang (bindgen)
        working-directory: .
        run: |
          sdkmanager --install "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - run: npm ci
      - name: Build debug APK
        run: npx tauri android build --apk --target aarch64 --debug
      - uses: actions/upload-artifact@v4
        with:
          name: infermark-android-debug-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error

  supply-chain:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
