[workspace]
resolver = "2"
members = [
    "crates/infermark-sdk",
    "crates/core",
    "crates/hwprobe",
    "apps/cli",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/infermark-sdk",
    "crates/core",
    "crates/hwprobe",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jkknikhil-git/infermark"
authors = ["InferMark contributors"]
rust-version = "1.80"

[workspace.dependencies]
infermark-sdk = { path = "crates/infermark-sdk" }
infermark-core = { path = "crates/core" }
infermark-hwprobe = { path = "crates/hwprobe" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["indexmap2", "chrono", "uuid1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.33"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
