[workspace]
resolver = "2"
members = [
    "crates/infermark-sdk",
    "crates/core",
    "crates/hwprobe",
    "crates/models",
    "crates/engine",
    "crates/telemetry",
    "apps/cli",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/infermark-sdk",
    "crates/core",
    "crates/hwprobe",
    "crates/models",
    "crates/engine",
    "crates/telemetry",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/jkknikhil-git/infermark"
authors = ["InferMark contributors"]
rust-version = "1.80"

[workspace.dependencies]
infermark-sdk = { path = "crates/infermark-sdk" }
infermark-core = { path = "crates/core" }
infermark-hwprobe = { path = "crates/hwprobe" }
infermark-models = { path = "crates/models" }
infermark-engine = { path = "crates/engine" }
infermark-telemetry = { path = "crates/telemetry" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["indexmap2", "chrono", "uuid1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
dirs = "6"
clap = { version = "4", features = ["derive"] }
sysinfo = "0.33"
tempfile = "3"
# HTTP: rustls only (no OpenSSL), no compression, no cookies.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

# Dependencies don't need debug info; this sharply cuts compile memory and target/ size
# (Tauri pulls in very large crates such as `windows`).
[profile.dev.package."*"]
debug = false

# Benchmarks must measure the hardware, not the compiler: optimize the measuring code even in
# development builds (otherwise e.g. the memory triad loop is CPU-bound and reads ~3x too low).
[profile.dev.package.infermark-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
